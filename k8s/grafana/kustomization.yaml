# Each dashboard JSON becomes a ConfigMap labelled grafana_dashboard=1:
# the Grafana sidecar of kube-prometheus-stack loads every such ConfigMap, in any namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-nodes
    files:
      - dashboard-nodes.json
