# Alerts on the pods of every namespace, from the kube-state-metrics series.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pods
  namespace: monitoring
spec:
  groups:
    - name: pods
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[10m]) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} restarted more than twice in 10 minutes. Check with kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous."

        - alert: PodNotReady
          expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not running"
            description: The pod has been Pending, Unknown or Failed for 10 minutes. Pending often means no node has room for it.

        - alert: PodImagePullError
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff|InvalidImageName"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
            description: "Container {{ $labels.container }} image cannot be pulled: wrong name, wrong tag or registry unreachable."

        - alert: ContainerOOMKilled
          expr: |
            max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1
            and on (namespace, pod, container)
            increase(kube_pod_container_status_restarts_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOM killed"
            description: The container went over its memory limit and was killed. Raise the limit or fix the leak.
